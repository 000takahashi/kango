[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kango"
version = "0.2.0"
description = "勘合：届いた連絡を、自分の契約台帳と会社の公式ドメインで照合するフィッシング判定（AI不使用・決定的）"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"

[tool.setuptools.package-data]
kango = ["brands.csv"]
