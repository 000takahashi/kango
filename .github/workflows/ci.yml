name: ci
on: [push, pull_request]
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sync_brands.py && git diff --exit-code   # 同梱データが data/brands.csv と食い違っていないか
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest && cd python && python -m pytest -q
      # 外の開発者と同じく「部品として入れて」動くか（同梱の会社一覧ごと入るか）も確かめる
      - run: |
          pip install ./python
          cd "$RUNNER_TEMP"
          python -c "import kango, sys; r = kango.judge('【楽天カード】ご請求額が確定しました https://www.rakuten-card.co.jp/', ledger=['rakuten']); print(r['level']); sys.exit(r['level'] != 'green')"
      # docs/integration.md の例が、入れた部品でそのまま動くか
      - run: for f in examples/python/*.py; do echo "$f"; python "$f" || exit 1; done
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test   # 設計図（Package.swift）はリポジトリのいちばん上にある
